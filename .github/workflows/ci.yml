name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Install
        run: uv sync --frozen
      - name: Unit tests
        run: uv run pytest -q
      - name: Style gate
        run: uv run python tools/check_style.py

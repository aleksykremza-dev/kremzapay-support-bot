[project]
name = "kremzapay-bot"
version = "1.0.0"
description = "Silnik bota wsparcia na wlasnej dokumentacji: kaskada intencji, RAG na Qdrant, guardrails, panel"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Oleksii Kremza"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "fastembed>=0.8.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

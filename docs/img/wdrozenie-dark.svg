<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Po lewej obecna wersja na jednym komputerze, po prawej wersja dla firmy z tym samym silnikiem i częściami do dobudowania wokół niego">
  <style>
    .bg{fill:#0d1117}
    .zone{fill:none;stroke:#3d444d;stroke-width:1.2}
    .now{fill:#0d1117;stroke:#e6edf3;stroke-width:1.3}
    .keep{fill:#12261a;stroke:#3fb950;stroke-width:1.5}
    .plan{fill:#231a33;stroke:#ab7df8;stroke-width:1.5;stroke-dasharray:6 4}
    .t{fill:#e6edf3;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px}
    .tb{fill:#e6edf3;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:600}
    .ts{fill:#9198a1;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11.5px}
    .th{fill:#9198a1;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em}
    .l{stroke:#e6edf3;stroke-width:1.3;fill:none}
    .lp{stroke:#ab7df8;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
    .ah{fill:#e6edf3}
    .ahp{fill:#ab7df8}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ahp"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" rx="10" class="bg"/>

  <rect x="10" y="10" width="270" height="460" rx="10" class="zone"/>
  <text x="145" y="36" text-anchor="middle" class="th">TERAZ · JEDEN KOMPUTER</text>
  <rect x="70" y="60" width="150" height="44" rx="6" class="now"/><text x="145" y="87" text-anchor="middle" class="tb">Czat WWW</text>
  <rect x="55" y="140" width="180" height="60" rx="6" class="keep"/><text x="145" y="166" text-anchor="middle" class="tb">Silnik (1 kopia)</text><text x="145" y="185" text-anchor="middle" class="ts">2 pytania naraz</text>
  <rect x="30" y="250" width="105" height="50" rx="6" class="now"/><text x="82" y="272" text-anchor="middle" class="tb">Ollama</text><text x="82" y="289" text-anchor="middle" class="ts">karta 4 GB</text>
  <rect x="155" y="250" width="105" height="50" rx="6" class="now"/><text x="207" y="272" text-anchor="middle" class="tb">Qdrant</text><text x="207" y="289" text-anchor="middle" class="ts">1 węzeł</text>
  <rect x="92" y="330" width="105" height="50" rx="6" class="now"/><text x="145" y="352" text-anchor="middle" class="tb">SQLite</text><text x="145" y="369" text-anchor="middle" class="ts">plik</text>
  <rect x="55" y="405" width="180" height="40" rx="6" class="now"/><text x="145" y="430" text-anchor="middle" class="t">Panel bez logowania</text>
  <line x1="145" y1="104" x2="145" y2="137" class="l" marker-end="url(#ar)"/>
  <line x1="110" y1="200" x2="85" y2="247" class="l" marker-end="url(#ar)"/>
  <line x1="180" y1="200" x2="205" y2="247" class="l" marker-end="url(#ar)"/>
  <line x1="145" y1="200" x2="145" y2="327" class="l" marker-end="url(#ar)"/>

  <line x1="290" y1="235" x2="318" y2="235" class="l" marker-end="url(#ar)"/>

  <rect x="325" y="10" width="565" height="460" rx="10" class="zone"/>
  <text x="607" y="36" text-anchor="middle" class="th">W FIRMIE · TEN SAM SILNIK</text>
  <rect x="345" y="55" width="125" height="40" rx="6" class="plan"/><text x="407" y="80" text-anchor="middle" class="t">Widget WWW</text>
  <rect x="485" y="55" width="110" height="40" rx="6" class="plan"/><text x="540" y="80" text-anchor="middle" class="t">E-mail</text>
  <rect x="610" y="55" width="130" height="40" rx="6" class="plan"/><text x="675" y="80" text-anchor="middle" class="t">Teams, WhatsApp</text>
  <rect x="345" y="120" width="395" height="40" rx="6" class="plan"/><text x="542" y="145" text-anchor="middle" class="tb">Logowanie SSO, klucze API, load balancer</text>
  <line x1="407" y1="95" x2="407" y2="117" class="lp" marker-end="url(#arp)"/>
  <line x1="540" y1="95" x2="540" y2="117" class="lp" marker-end="url(#arp)"/>
  <line x1="675" y1="95" x2="675" y2="117" class="lp" marker-end="url(#arp)"/>
  <rect x="345" y="185" width="120" height="56" rx="6" class="keep"/><text x="405" y="209" text-anchor="middle" class="tb">Silnik</text><text x="405" y="227" text-anchor="middle" class="ts">kopia 1</text>
  <rect x="482" y="185" width="120" height="56" rx="6" class="keep"/><text x="542" y="209" text-anchor="middle" class="tb">Silnik</text><text x="542" y="227" text-anchor="middle" class="ts">kopia 2</text>
  <rect x="619" y="185" width="120" height="56" rx="6" class="keep"/><text x="679" y="209" text-anchor="middle" class="tb">Silnik</text><text x="679" y="227" text-anchor="middle" class="ts">kopia N</text>
  <line x1="405" y1="160" x2="405" y2="182" class="lp" marker-end="url(#arp)"/>
  <line x1="542" y1="160" x2="542" y2="182" class="lp" marker-end="url(#arp)"/>
  <line x1="679" y1="160" x2="679" y2="182" class="lp" marker-end="url(#arp)"/>
  <rect x="345" y="285" width="120" height="58" rx="6" class="plan"/><text x="405" y="308" text-anchor="middle" class="tb">Model LLM</text><text x="405" y="326" text-anchor="middle" class="ts">vLLM na GPU / Azure</text>
  <rect x="482" y="285" width="120" height="58" rx="6" class="plan"/><text x="542" y="308" text-anchor="middle" class="tb">Qdrant</text><text x="542" y="326" text-anchor="middle" class="ts">klaster</text>
  <rect x="619" y="285" width="120" height="58" rx="6" class="plan"/><text x="679" y="308" text-anchor="middle" class="tb">Postgres + Redis</text><text x="679" y="326" text-anchor="middle" class="ts">dane, kolejka, cache</text>
  <line x1="542" y1="241" x2="405" y2="282" class="lp" marker-end="url(#arp)"/>
  <line x1="542" y1="241" x2="542" y2="282" class="lp" marker-end="url(#arp)"/>
  <line x1="542" y1="241" x2="679" y2="282" class="lp" marker-end="url(#arp)"/>
  <rect x="760" y="185" width="115" height="56" rx="6" class="plan"/><text x="817" y="209" text-anchor="middle" class="tb">Helpdesk</text><text x="817" y="227" text-anchor="middle" class="ts">Zendesk, Jira</text>
  <line x1="739" y1="213" x2="757" y2="213" class="lp" marker-end="url(#arp)"/>
  <rect x="760" y="285" width="115" height="58" rx="6" class="plan"/><text x="817" y="308" text-anchor="middle" class="tb">Monitoring</text><text x="817" y="326" text-anchor="middle" class="ts">metryki, alerty</text>
  <rect x="345" y="375" width="530" height="44" rx="6" class="keep"/><text x="610" y="402" text-anchor="middle" class="tb">Panel operatora: kolejka „Czeka na człowieka”, z logowaniem i rolami</text>
  <text x="607" y="447" text-anchor="middle" class="ts">kaskada, reguły, sędzia, przekazanie człowiekowi i maskowanie danych zostają takie same</text>

  <rect x="345" y="456" width="18" height="10" rx="2" class="keep"/><text x="369" y="465" class="ts">jest w silniku</text>
  <rect x="470" y="456" width="18" height="10" rx="2" class="plan"/><text x="494" y="465" class="ts">do dobudowania</text>
</svg>
